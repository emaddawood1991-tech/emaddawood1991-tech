  .card { position: absolute; border-radius: 24px; background: #fff; border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
  .h { position: absolute; font: 900 112px/1 var(--body); letter-spacing: -.035em; color: var(--ink); white-space: nowrap; }
</style>

<script>
(function () {

  const el = (host, id, cls, css, text) => { const d = document.createElement("div"); d.id = id; d.className = cls || ""; if (css) d.style.cssText = (/position:/.test(css) || !/(left|top):/.test(css) ? "" : "position:absolute;") + css; if (text) d.textContent = text; host.appendChild(d); return d; };

  const wipe = el(s1i, "wipe1", "", "left:536px;top:280px;width:10px;height:740px;background:#C8F031;border:3px solid #111317;box-shadow:0 0 30px #C8F031;opacity:0");

  const th = PW("p0", "edit");
  tl.from(h1a, { opacity: 0, x: -120, duration: 0.3, ease: "power3.out" }, 0.45); tl.from(h1b, { opacity: 0, x: 140, scale: 0.9, duration: 0.3, ease: "power3.out" }, th - 0.1);
  const bot1 = botAt(s1i, "bot1", 800, 760, 200);
  bot1.rise(tl, 0.9, 520, 0.4); bot1.blinks(tl, 1.2, 2.6, 1.1); bot1.react(tl, th, "wow");

  /* ================================================================= S2  WHAT IT DOES: schematic editor (rebuilt) */
  const s2i = bg("s2", false);
  hud(s2i, "h2", "MEET CHATCUT", S.s2.start + 0.2);
  const win = el(s2i, "win", "card", "left:40px;top:290px;width:1000px;height:850px;overflow:hidden");
  el(win, "winb", "", "left:0;top:0;width:1000px;height:64px;background:#111317"); ["#FF5F57", "#FEBC2E", "#28C840"].forEach((c, i) => el(win, "wd" + i, "", "left:" + (24 + i * 34) + "px;top:21px;width:22px;height:22px;border-radius:50%;background:" + c));
  el(win, "wt", "", "left:150px;top:0;font:700 26px/64px var(--mono);color:#C8F031", "ChatCut · editor (schematic)");
  el(win, "prev", "", "left:30px;top:92px;width:300px;height:520px;border-radius:20px;background:linear-gradient(135deg,#34405E,#1D2538);border:3px solid #111317");
  el(win, "pbub", "", "left:360px;top:92px;width:610px;height:110px;border-radius:20px;background:#C8F031;border:3px solid #111317;font:800 30px/1.25 var(--body);padding:18px 24px;box-sizing:border-box;color:#111317", "Remove pauses and add captions");
  el(win, "pbub2", "", "left:360px;top:222px;width:610px;height:70px;border-radius:20px;background:#EEF1F6;border:3px solid #111317");
  const rows = [["V1", 650], ["A1", 700], ["CAP", 750], ["B-ROLL", 800]];
  rows.forEach(([l, y]) => { el(win, "tl" + l, "", "left:0;top:" + y + "px;width:1000px;height:46px;border-top:2px solid #CBD2DE"); el(win, "tn" + l, "", "left:12px;top:" + (y + 12) + "px;font:800 17px/1 var(--mono);color:#667085", l); });
  const vc = [[110, 250], [370, 520], [540, 800]].map(([a, b], i) => el(win, "vc" + i, "", "left:" + a + "px;top:656px;width:" + (b - a) + "px;height:34px;border-radius:8px;background:#2F5BFF;border:3px solid #111317"));

  const caps = [130, 300, 480, 640].map((x, i) => { const c = el(win, "cp" + i, "", "left:" + x + "px;top:756px;width:130px;height:34px;border-radius:8px;background:#C8F031;border:3px solid #111317"); el(c, "cpl" + i, "", "left:12px;top:12px;width:80px;height:6px;border-radius:3px;background:#111317"); return c; });
  const brl = el(win, "brl", "", "left:420px;top:806px;width:230px;height:34px;border-radius:8px;background:#FF5B3A;border:3px solid #111317");
  const ph = el(win, "ph", "", "left:110px;top:640px;width:6px;height:200px;background:#C8F031;box-shadow:0 0 0 2px #111317,0 0 20px #C8F031");
  tl.fromTo(win, { y: 700, rotation: 4, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, S.s2.start + 0.1);
  tl.fromTo(ph, { x: 0 }, { x: 640, duration: 6.2, ease: "none" }, S.s2.start + 0.5);
  const tCut = PW("p2", "Cut"), tCap = PW("p2", "captions"), tBr = PW("p2", "B-roll");
  const rz = el(win, "rz", "", "left:250px;top:630px;width:4px;height:230px;background:#FF5B3A;opacity:0"); tl.fromTo(rz, { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.15 }, tCut); tl.to(rz, { opacity: 0, duration: 0.2 }, tCut + 0.3);
  tl.to(pause, { width: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, tCut + 0.15); tl.to([vc[1], vc[2]], { x: -120, duration: 0.25, ease: "power3.inOut" }, tCut + 0.3);
  caps.forEach((c, i) => tl.from(c, { opacity: 0, y: -26, scale: 0.7, duration: 0.2, ease: "back.out(2)" }, tCap + i * 0.1));
  tl.from(brl, { opacity: 0, y: -120, duration: 0.3, ease: "bounce.out" }, tBr);
  const feat = (id, x, txt, at) => { const c = chip(s2i, id, x, 1170, txt, { size: 36, pad: "14px 26px 16px", bg: "#fff" }); tl.fromTo(c, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2 }, S.s2.start + 0.7); tl.to(c, { backgroundColor: "#C8F031", scale: 1.12, duration: 0.15, ease: "back.out(2)" }, at); tl.to(c, { scale: 1, duration: 0.2 }, at + 0.5); return c; };
  feat("f1", 40, "✂ CUT", tCut); feat("f2", 330, "CC CAPTIONS", tCap); feat("f3", 650, "B-ROLL", tBr);
  const tag = (id, x, txt, at) => { const c = chip(s2i, id, x, 1262, txt, { size: 24, pad: "10px 20px 12px", bg: "#F3EFE6" }); pop(c, at); return c; };
  tag("g1", 40, "IMPORT", PW("p2b", "Import") - 0.05); tag("g2", 270, "TRANSCRIBE", PW("p2b", "transcribe") - 0.05); tag("g3", 600, "EXPORT", PW("p2b", "export") - 0.05);
  chip(s2i, "reb2", 60, 1340, "REBUILT SCHEMATIC · REPLACE WITH REAL CHATCUT RECORDING", { size: 18, pad: "8px 14px 9px", bg: "#FFC83D" }); tl.from("#reb2", { opacity: 0, duration: 0.2 }, S.s2.start + 0.8);
  const bot2 = botAt(s2i, "bot2", 880, 1110, 170);

  bot2.aimPoint(tl, tCut - 0.3, { x: 880, y: 1110, scale: 1, target: [650, 960], hand: "L", hold: 0.5 }); bot2.react(tl, tBr + 0.1, "wow");

    { t: "> /goal Read chatcut.io/claude", c: "hl" }, { t: "  to install and use the", c: "hl" }, { t: "  ChatCut plugin", c: "hl" } ] });

  tl.to(k3, { y: 8, boxShadow: "0 2px 0 #111317", duration: 0.07 }, pr3.tapAt); tl.to(k3, { y: 0, boxShadow: "0 10px 0 #111317", duration: 0.14 }, pr3.tapAt + 0.07);
  bot3.blinks(tl, S.s3.start, S.s3.end, 1.1); bot3.react(tl, P("p4").start + 0.3, "think");
  const step = (id, x, n, big, small, at) => { const c = el(s3i, id, "card", "left:" + x + "px;top:1000px;width:300px;height:200px;box-shadow:8px 8px 0 #C8F031"); el(c, id + "n", "", "left:18px;top:16px;width:46px;height:46px;border-radius:50%;background:#111317;color:#C8F031;font:900 28px/46px var(--mono);text-align:center", n); el(c, id + "b", "", "left:18px;top:80px;font:900 25px/1.1 var(--body);color:#111317", big); el(c, id + "s", "", "left:18px;top:128px;width:268px;font:700 18px/1.25 var(--mono);color:#475069", small); tl.from(c, { opacity: 0, y: 60, scale: 0.9, duration: 0.3, ease: "back.out(1.8)" }, at); return c; };
