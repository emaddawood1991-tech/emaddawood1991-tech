  .mono { font-family: var(--mono); white-space: pre; }
  .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .rv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const E = window.EP, S = E.scenes, D = window.DATA, $ = id => document.getElementById(id);
  const NSs = "http://www.w3.org/2000/svg";
  const P = id => E.phrases.find(p => p.id === id);
  const PW = (pid, txt, n) => { const p = P(pid); let c = 0; for (const w of E.words) { if (w.s >= p.start - 0.001 && w.s <= p.end && w.w.replace(/[.,:!?"“”]/g, "").toLowerCase() === txt.toLowerCase()) { if (c === (n || 0)) return w.s; c++; } } throw new Error("word " + pid + ":" + txt); };
  const el = (host, id, cls, css, text) => { const d = document.createElement("div"); d.id = id; d.className = cls || ""; if (css) d.style.cssText = (/position:/.test(css) || !/(left|top):/.test(css) ? "" : "position:absolute;") + css; if (text) d.textContent = text; host.appendChild(d); return d; };
  const svgEl = (host, tag, attrs) => { const e = document.createElementNS(NSs, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); host.appendChild(e); return e; };
  const botAt = (host, id, x, y, w) => Robot.create(host, { id, w: w || 200, x, y });
  const chip = (host, id, x, y, text, o) => { o = o || {}; return el(host, id, "chip", "left:" + x + "px;top:" + y + "px;padding:" + (o.pad || "10px 20px 12px") + ";border-radius:999px;font:800 " + (o.size || 26) + "px/1 var(--mono);letter-spacing:.05em;color:" + (o.fg || "#FFF6E8") + ";background:" + (o.bg || "rgba(27,42,65,.86)") + ";border:2px solid " + (o.bd || "#F2B544"), text); };
  const fadeIn = (e, at, d, y) => tl.from(e, { opacity: 0, y: y == null ? 40 : y, duration: d || 0.3, ease: "power3.out" }, at);
  const hud = (host, id, label, t0) => { const k = chip(host, id + "k", 60, 236, label); tl.from(k, { opacity: 0, x: -30, duration: 0.25 }, t0); return k; };
  const paper = (k, grid) => {
    const inn = $(k + "i");
    el(inn, "bg" + k, "", "position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 30%,#FBF3E4 0%,#F3E9D8 60%,#E6D7BC 100%)");
    const gr = el(inn, "bgg" + k, "", "position:absolute;inset:0;background-image:linear-gradient(rgba(27,42,65,.09) 2px,transparent 2px),linear-gradient(90deg,rgba(27,42,65,.09) 2px,transparent 2px);background-size:90px 90px");
    tl.to(gr, { backgroundPosition: "180px 360px", duration: S[k].len, ease: "none" }, S[k].start);
    return inn;
  };
  const img = (host, id, src, css) => { const i = document.createElement("img"); i.id = id; i.src = "assets/" + src; i.style.cssText = "position:absolute;" + (css || ""); host.appendChild(i); return i; };
  const wrapScene = (k) => { const inn = $(k + "i"), w = el(inn, "cam" + k, "", "left:0;top:0;width:1080px;height:1920px;will-change:transform"); Array.from(inn.children).filter(c => c !== w && !/^bg/.test(c.id)).forEach(c => w.appendChild(c)); Cam.frame(w, 540, 960, 1); return w; };
  const zoomTo = (cam, cx, cy, s, at, dur) => tl.to(cam, { scale: s, x: 540 - cx * s, y: cy * (1 - s), duration: dur || 0.7, ease: "power2.inOut" }, at);
  const zoomOut = (cam, at, dur) => tl.to(cam, { scale: 1, x: 0, y: 0, duration: dur || 0.7, ease: "power2.inOut" }, at);
  const INK = "#1B2A41", TER = "#D9643A", SUN = "#F2B544";

  /* ---- original conceptual plan, drawn from the same numbers as the Blender model (plot 40 x 30 m, +y = north). CONCEPT, NOT TO SCALE. ---- */
  function planSvg(host, id, x, y, w, o) {
    o = o || {}; const sc = w / 44, h = 34 * sc, g = el(host, id, "", "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px");
    const sv = svgEl(g, "svg", { viewBox: "-22 -17 44 34", width: w, height: h });
    const R = (x0, y0, w0, h0, a) => svgEl(sv, "rect", Object.assign({ x: x0, y: -(y0 + h0), width: w0, height: h0 }, a));
    const parts = [];
    parts.push(R(-20, -15, 40, 30, { fill: "#EFE2C6", stroke: INK, "stroke-width": 0.35, "stroke-dasharray": "1.2 .8" }));
    parts.push(R(-9, 1.25, 13, 7.5, { fill: "#fff", stroke: INK, "stroke-width": 0.3 })); parts.push(R(4, 2.25, 5, 6.5, { fill: "#fff", stroke: INK, "stroke-width": 0.3 }));
    parts.push(R(o.poolX == null ? 3.9 : o.poolX, -6.3, 7.2, 3.6, { fill: "#7FD4F2", stroke: INK, "stroke-width": 0.3 }));
    parts.push(R(-12, -15.4, 4, 0.8, { fill: SUN, stroke: INK, "stroke-width": 0.25 }));
    const dr = svgEl(sv, "path", { d: "M-10 14.9 L-10 9 L-4 6.5 L3.4 6.2", transform: "scale(1,-1)", fill: "none", stroke: "#B9A68A", "stroke-width": 2.2, opacity: 0.9 }); parts.push(dr);
    [[-14, -9], [-14, 2], [15, -10], [15, 9], [3, 12], [-9, 11.5]].forEach(([px, py]) => { const c = svgEl(sv, "circle", { cx: px, cy: -py, r: 1.3, fill: "#3E8E4B", stroke: INK, "stroke-width": 0.2 }); parts.push(c); });
    const tx = (t, px, py, s) => { const e = svgEl(sv, "text", { x: px, y: -py, "font-size": s || 1.7, "font-family": "JetBrains Mono, monospace", "font-weight": 800, fill: INK, "text-anchor": "middle" }); e.textContent = t; return e; };
    const labs = [tx("HOUSE", -2.5, 4.6), tx("POOL", 7.5, -4.6, 1.5), tx("GATE", -10, -13.8, 1.4), tx("N ↑", 18, 13, 1.6)];
    return { g, sv, parts, labs };
  }

  /* ---- terminal card with stepped typing ---- */
  function term(host, id, x, y, w, h, title, rows, t0, fs, lh) {
    const card = el(host, id, "", "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px;overflow:hidden;background:#0B1630");
    el(card, id + "b", "", "left:0;top:0;width:" + w + "px;height:56px;background:#16294F;border-bottom:2px solid #60CDFF");
    [0, 1, 2].forEach(i => el(card, id + "d" + i, "", "left:" + (22 + i * 28) + "px;top:20px;width:16px;height:16px;border-radius:50%;background:#60CDFF;opacity:" + (0.9 - i * 0.25)));
    el(card, id + "t", "", "left:120px;top:0;font:700 24px/56px var(--body);color:#DDEBFF", title);
    let t = t0;
    rows.forEach((r, i) => {
      const yy = 80 + i * lh, d = el(card, id + "r" + i, "mono", "left:26px;top:" + yy + "px;font:600 " + fs + "px/" + lh + "px var(--mono);color:" + (r[1] || "#fff"), r[0]);
      const at = r[3] != null ? r[3] : t;
      if (r[2]) { const n = Math.max(1, r[0].length), dur = n / r[2]; d.style.clipPath = "inset(0 100% 0 0)"; tl.fromTo(d, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "steps(" + n + ")" }, at); t = at + dur + 0.05; }
      else { tl.from(d, { opacity: 0, x: -14, duration: 0.14 }, at); t = at + 0.1; }
    });
    return { card, end: t };
  }
  const lap = (host, id, x, y, w, sh) => {
    const sw = w - 44, lidH = sh + 44, g = el(host, id, "", "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + (lidH + 34) + "px");
    const lid = el(g, id + "lid", "", "left:0;top:0;width:" + w + "px;height:" + lidH + "px;border-radius:22px 22px 8px 8px;background:linear-gradient(180deg,#2B3A55,#121A2C);border:3px solid " + INK + ";box-shadow:0 34px 70px rgba(27,42,65,.45)");
    const scr = el(lid, id + "scr", "", "left:19px;top:19px;width:" + sw + "px;height:" + sh + "px;overflow:hidden;border-radius:6px;background:#0B1630");
    el(g, id + "base", "", "left:" + (-w * 0.04) + "px;top:" + lidH + "px;width:" + (w * 1.08) + "px;height:22px;border-radius:0 0 22px 22px;background:linear-gradient(180deg,#C9C2B5,#8F877A);box-shadow:0 14px 30px rgba(27,42,65,.4)");
    return { g, scr, sw, sh, cx: x + w / 2, bottom: y + lidH + 34 };
  };

  /* ================================================================= S1 HOOK: empty land -> concept */
  const s1i = $("s1i");
  el(s1i, "bgs1", "", "position:absolute;inset:0;background:#B7A88E");
  const eImg = img(s1i, "s1e", "hero_empty.jpg", "left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 60%");
  const fWrap = el(s1i, "s1fw", "", "left:0;top:0;width:1080px;height:1920px;overflow:hidden;clip-path:inset(0 100% 0 0)");
  const fImg = img(fWrap, "s1f", "hero_final.jpg", "left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 60%");
  const handle = el(s1i, "s1h", "", "left:0;top:0;width:8px;height:1920px;background:#60CDFF;box-shadow:0 0 30px #60CDFF;opacity:0;z-index:6");
  const wipe = (at, dur, from, to) => { const o = { v: from }; tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: "power2.inOut", onUpdate: () => { fWrap.style.clipPath = "inset(0 " + (100 - o.v * 100) + "% 0 0)"; handle.style.left = (o.v * 1080 - 4) + "px"; handle.style.opacity = (o.v > 0.005 && o.v < 0.995) ? 1 : 0; } }, at); };
  tl.fromTo([eImg, fImg], { scale: 1.0 }, { scale: 1.12, duration: S.s1.len, ease: "none" }, 0);
  wipe(0.25, 0.45, 0, 1); wipe(1.2, 0.35, 1, 0);                          // one-second flash of the finished property, then back to empty land
  const tBec = PW("p2", "becomes"); wipe(tBec + 0.05, 1.1, 0, 1);       // transformation
  const lbE = chip(s1i, "s1le", 60, 236, "EMPTY PLOT · BLENDER RENDER"); const lbF = chip(s1i, "s1lf", 60, 236, "AI-ASSISTED 3D CONCEPT", { bd: "#60CDFF" });
  tl.from(lbE, { opacity: 0, x: -30, duration: 0.25 }, 0.05); tl.to(lbE, { opacity: 0, duration: 0.2 }, tBec); tl.set(lbF, { opacity: 0 }, 0); tl.to(lbF, { opacity: 1, duration: 0.3 }, tBec + 1.0);
  const bigH = el(s1i, "s1big", "t1", "left:0;right:0;text-align:center;top:830px;font-size:104px;line-height:1.05;white-space:pre;color:#fff;text-shadow:0 8px 40px rgba(11,22,48,.8)", "YOUR LAND.\nYOUR PLAN.");
  tl.from(bigH, { opacity: 0, scale: 1.4, duration: 0.4, ease: "back.out(1.8)" }, PW("p1", "dream") - 0.2); tl.to(bigH, { opacity: 0, duration: 0.25 }, tBec - 0.2);
  const bot1 = botAt(s1i, "bot1", 60, 1230, 220); bot1.face(tl, 0, 1, 0.01); bot1.rise(tl, 1.2, 420, 0.45); bot1.blinks(tl, 1.5, S.s1.end, 1.1);
  bot1.aimPoint(tl, tBec - 0.4, { x: 60, y: 1230, scale: 1, target: [620, 880], hand: "R", hold: 0.9 }); bot1.react(tl, tBec + 1.0, "wow");

  /* ================================================================= S2 THE THREE INPUTS */
  const s2i = paper("s2"); hud(s2i, "h2", "STEP 1 · THE INPUTS", S.s2.start + 0.15);
  const tPh = PW("p3", "photo"), tLo = PW("p3", "location"), tPl = PW("p3", "plan");
  const c1 = el(s2i, "c1", "card", "left:50px;top:320px;width:480px;height:560px"); const i1 = img(c1, "c1i", "hero_empty.jpg", "left:-150px;top:0;width:690px;height:1227px;transform:scale(.62);transform-origin:0 0;object-fit:cover"); i1.style.cssText = "position:absolute;left:0;top:0;width:480px;height:560px;object-fit:cover;object-position:50% 70%";
  chip(c1, "c1l", 14, 502, "SAMPLE LAND · BLENDER RENDER", { size: 17, pad: "7px 12px 9px" });
  tl.from(c1, { opacity: 0, x: -360, rotation: -10, duration: 0.5, ease: "back.out(1.5)" }, tPh - 0.2);
  const c2 = el(s2i, "c2", "card", "left:550px;top:320px;width:480px;height:560px;background:#E8DFC9");
  const mp = svgEl(el(c2, "c2s", "", "left:0;top:0;width:480px;height:560px"), "svg", { viewBox: "0 0 480 560", width: 480, height: 560 });
  for (let i = 1; i < 8; i++) { svgEl(mp, "line", { x1: 0, y1: i * 70, x2: 480, y2: i * 70, stroke: "rgba(27,42,65,.18)", "stroke-width": 2 }); svgEl(mp, "line", { x1: i * 60, y1: 0, x2: i * 60, y2: 560, stroke: "rgba(27,42,65,.18)", "stroke-width": 2 }); }
  svgEl(mp, "path", { d: "M-10 420 C120 330 220 470 330 380 S470 300 500 330", fill: "none", stroke: "#8FB8D8", "stroke-width": 26, "stroke-linecap": "round" });
  svgEl(mp, "path", { d: "M40 40 L200 180 L260 270 L420 520", fill: "none", stroke: "#fff", "stroke-width": 14 });
  const pin = svgEl(mp, "path", { d: "M300 150 c-40 0 -62 30 -62 62 c0 44 62 100 62 100 s62 -56 62 -100 c0 -32 -22 -62 -62 -62 z", fill: TER, stroke: INK, "stroke-width": 5 }); svgEl(mp, "circle", { cx: 300, cy: 212, r: 20, fill: "#fff" });
  chip(c2, "c2l", 14, 502, "SAMPLE LOCATION · SCHEMATIC, NOT A REAL MAP", { size: 15, pad: "7px 12px 9px" });
  tl.from(c2, { opacity: 0, x: 360, rotation: 10, duration: 0.5, ease: "back.out(1.5)" }, tLo - 0.2); tl.from(pin, { y: -120, opacity: 0, duration: 0.4, ease: "bounce.out" }, tLo + 0.25);
  const c3 = el(s2i, "c3", "card", "left:190px;top:930px;width:700px;height:520px;background:#F7F0E0"); const PL = planSvg(c3, "pl3", 22, 24, 656, {});
  chip(c3, "c3l", 14, 466, "CONCEPT PLAN · NOT TO SCALE", { size: 17, pad: "7px 12px 9px" });
  tl.from(c3, { opacity: 0, y: 360, duration: 0.5, ease: "back.out(1.4)" }, tPl - 0.2);
  PL.parts.forEach((p, i) => { p.style.strokeDasharray = "none"; tl.from(p, { opacity: 0, duration: 0.2 }, tPl + 0.1 + i * 0.07); });
  const brief = el(s2i, "brief", "t1", "left:0;right:0;text-align:center;top:1010px;font-size:96px;color:" + INK, "ONE CLEAR BRIEF");
  const tBr = PW("p4", "clear");
  tl.to(c1, { x: 250, y: 330, scale: 0.7, rotation: -4, duration: 0.55, ease: "power3.inOut" }, P("p4").start - 0.1); tl.to(c2, { x: -250, y: 330, scale: 0.7, rotation: 4, duration: 0.55, ease: "power3.inOut" }, P("p4").start - 0.1);
  tl.to(c3, { y: 330, scale: 0.78, duration: 0.55, ease: "power3.inOut" }, P("p4").start - 0.1);
  tl.from(brief, { opacity: 0, scale: 1.5, duration: 0.35, ease: "back.out(2)" }, tBr - 0.15);
  const bot2 = botAt(s2i, "bot2", 880, 1330, 150); bot2.face(tl, 0, -1, 0.01); bot2.rise(tl, S.s2.start + 0.5, 420, 0.4); bot2.blinks(tl, S.s2.start, S.s2.end, 1.1);
  bot2.aimPoint(tl, tPl - 0.3, { x: 880, y: 1330, scale: 1, target: [700, 1100], hand: "L", hold: 0.8 }); bot2.react(tl, tBr + 0.2, "nod");

  /* ================================================================= S3 GIVE CLAUDE THE PLAN */
  const s3i = paper("s3"); hud(s3i, "h3", "STEP 2 · THE BRIEF", S.s3.start + 0.15);
  const tHo = PW("p5", "house"), tEn = PW("p5", "entrance"), tPo = PW("p5", "pool"), tGa = PW("p5", "garden");
  const L3 = lap(s3i, "l3", 60, 300, 960, 520); tl.from(L3.g, { opacity: 0, y: 120, scale: 0.94, duration: 0.6, ease: "power3.out" }, S.s3.start + 0.15);
  const BRIEF = ["› Create an original sample property:", "  · desert plot, boundary walls", "  · modern single-story residence", "  · small swimming pool", "  · palm trees, walking paths", "  · driveway and entrance gate", "› Label it CONCEPT. No engineering claims."];
  const T3 = term(L3.scr, "t3", 0, 0, L3.sw, L3.sh, "Claude Code · brief (verbatim from the project brief)", BRIEF.map((l, i) => [l, i === 0 || i === 6 ? "#FFE08A" : "#DDEBFF", 34, i === 0 ? S.s3.start + 0.5 : null]), S.s3.start + 0.5, 30, 66);
  chip(s3i, "c3a", 60, 1000, "ATTACHED:  land.jpg · location · plan.png", { size: 22, pad: "10px 16px 12px", bd: "#60CDFF" }); tl.from("#c3a", { opacity: 0, y: 30, duration: 0.3 }, S.s3.start + 0.9);
  const pl3b = planSvg(s3i, "pl3b", 60, 1070, 560, {}); tl.from(pl3b.g, { opacity: 0, y: 60, duration: 0.4 }, S.s3.start + 1.1);
  const marks = [["HOUSE · NORTH", tHo, 700, 1090], ["ENTRANCE · SOUTH GATE", tEn, 640, 1170], ["POOL · BESIDE PORCH", tPo, 700, 1250], ["GARDEN · LAWN + PATH", tGa, 640, 1330]];
  marks.forEach(([t, at, x, y], i) => { const c = chip(s3i, "mk" + i, x, y, t, { size: 21, pad: "9px 14px 11px", bd: TER }); tl.from(c, { opacity: 0, x: 80, duration: 0.3, ease: "power3.out" }, at - 0.15); });
  const dsh = el(s3i, "docs", "card", "left:620px;top:1400px;width:400px;height:120px;background:#FBF7EE;opacity:0"); img(dsh, "docsi", "shot-claude-code-docs.png", "left:0;top:-30px;width:400px;object-fit:cover;object-position:0 0");
  const bot3 = botAt(s3i, "bot3", 880, 1560, 130);
  bot3.face(tl, 0, -1, 0.01); bot3.rise(tl, S.s3.start + 0.6, 420, 0.4); bot3.blinks(tl, S.s3.start, S.s3.end, 1.1);
  bot3.aimPoint(tl, tHo - 0.35, { x: 880, y: 1560, scale: 1, target: [700, 1100], hand: "L", hold: 0.8 }); bot3.react(tl, PW("p6", "specific") + 0.2, "think");

  /* ================================================================= S4 CLAUDE CODE + BLENDER */
  const s4i = paper("s4"); hud(s4i, "h4", "STEP 3 · CLAUDE CODE + BLENDER", S.s4.start + 0.15);
