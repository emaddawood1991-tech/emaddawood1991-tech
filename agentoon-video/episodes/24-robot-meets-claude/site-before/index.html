<!DOCTYPE html>
<html>
<head><title>Maple Street Bakery</title></head>
<body>
<h1>Maple Street Bakery</h1>
<a href="#menu">Menu</a> | <a href="#order">Order</a> | <a href="#news">Newsletter</a>
<hr>
<h2>Welcome</h2>
<p>We bake bread every morning. Open 7am to 3pm, Tuesday to Sunday.</p>
<h2 id="menu">Menu</h2>
<ul>
<li>Croissant - $3.50</li>
<li>Sourdough loaf - $7.00</li>
<li>Cinnamon roll - $4.25</li>
</ul>
<h2 id="order">Order</h2>
<button id="add-croissant">Add croissant</button>
<button id="add-sourdough">Add sourdough</button>
<button id="add-roll">Add cinnamon roll</button>
<p>Items in your order: <span id="cart-count">0</span></p>
<h2 id="news">Newsletter</h2>
<form id="news-form">
<input type="text" id="email" placeholder="your email">
<button type="submit">Subscribe</button>
</form>
<p id="news-msg"></p>
<script>
var count = 0;
function addItem() {
  count = count + 1;
  document.getElementById("cart-total").textContent = count;
}
document.getElementById("add-croissant").onclick = addItem;
document.getElementById("add-sourdough").onclick = addItem;
document.getElementById("add-roll").onclick = addItem;
document.getElementById("news-form").onsubmit = function (e) {
  e.preventDefault();
  var v = document.getElementById("email").value;
  var msg = document.getElementById("news-msg");
  if (v.indexOf("@") === -1) { msg.textContent = "Please enter a valid email."; }
  else { msg.textContent = "Thanks for subscribing!"; }
};
</script>
</body>
</html>
