     Every 3D picture is the user's real Blender animatic or render; terminal/code text is verbatim from the project. Nothing is a recorded website. */

  .mono { font-family: var(--mono); white-space: pre; }

  const el = (host, id, cls, css, text) => { const d = document.createElement("div"); d.id = id; d.className = cls || ""; if (css) d.style.cssText = (/position:/.test(css) || !/(left|top):/.test(css) ? "" : "position:absolute;") + css; if (text) d.textContent = text; host.appendChild(d); return d; };
  const svgEl = (host, tag, attrs) => { const e = document.createElementNS(NSs, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); host.appendChild(e); return e; };

  const wrapScene = (k) => { const inn = $(k + "i"), w = el(inn, "cam" + k, "", "left:0;top:0;width:1080px;height:1920px;will-change:transform"); Array.from(inn.children).filter(c => c !== w && !/^bg/.test(c.id)).forEach(c => w.appendChild(c)); Cam.frame(w, 540, 960, 1); return w; };

  const tag = (host, id, text, t0, o) => { const c = chip(host, id, 60, 236, text, o); c.style.zIndex = 9; tl.from(c, { opacity: 0, x: -30, duration: 0.3 }, t0); return c; };

  const mk = el(rul, "mk", "", "left:952px;top:0;width:110px;height:44px;border-radius:10px 0 0 10px;background:" + BZ + ";overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)");

  strip.setAttribute("data-layout-ignore", ""); mk.setAttribute("data-layout-ignore", ""); strip.textContent = Array.from({ length: 50 }, (_, i) => String(i + 1).padStart(2, "0")).join("\n");

  /* ================================================================= S1 HOOK: the finished tower first, pull-back reveal */

  el(s1i, "g2", "", "position:absolute;left:0;top:1250px;width:1080px;height:670px;background:linear-gradient(0deg,rgba(6,13,28,.92) 0%,rgba(6,13,28,.5) 55%,rgba(6,13,28,0) 100%);z-index:3");
  const t50 = PW("p1", "50-floor");
  const a1 = el(s1i, "a1", "ser", "left:70px;top:210px;font-size:150px;line-height:1;color:#fff;z-index:9;text-shadow:0 8px 30px rgba(0,0,0,.5)", "50 FLOORS.");

  const a3 = el(s1i, "a3", "ser", "left:650px;top:360px;font-size:150px;line-height:1;color:" + AZ + ";z-index:9;text-shadow:0 8px 30px rgba(0,0,0,.5)", "AI.");
  [a1, a2, a3].forEach((a, i) => tl.from(a, { opacity: 0, y: 70, scale: 1.18, duration: 0.45, ease: "back.out(1.7)" }, 0.15 + i * 0.35));
  const k1 = chip(s1i, "k1", 70, 560, "FICTIONAL CONCEPT · THE BRIEF SAYS 50 FLOORS", { size: 24, bd: BZ }); k1.style.zIndex = 9; tl.from(k1, { opacity: 0, x: -40, duration: 0.3 }, 1.4);
  const k2 = chip(s1i, "k2", 70, 626, "~30 MIN OF PROMPTING · MY COUNT", { size: 28, bd: AZ, fg: GL }); k2.style.zIndex = 9; tl.from(k2, { opacity: 0, x: -40, duration: 0.3 }, 2.1);
  setF(1); ruler(true, 0.3); moveF(50, 0.4, 3.6, "power2.inOut"); ruler(false, S.s1.end - 0.4);
  const bot1 = presenter(botAt(s1i, "bot1", 860, 1290, 190), "s1", -1); speak(bot1, "p1"); bot1.react(tl, t50 + 0.6, "wow");

  /* ================================================================= S2 THE IDEA: a fictional coast site (honest label, not Google Maps) */
  const s2i = dark("s2"); const vS2 = $("v2"); s2i.appendChild(vS2);
  tl.fromTo(vS2, { scale: 1.0 }, { scale: 1.06, duration: S.s2.len, ease: "none" }, S.s2.start);
  tag(s2i, "h2", "THE IDEA · A TOWER ON THE DUBAI COAST", S.s2.start + 0.25, { bd: AZ });
  const brk = (x, y, rx, ry) => { const g = el(s2i, "br" + x + y, "", "left:" + x + "px;top:" + y + "px;width:70px;height:70px;z-index:6"); const sv = svgEl(g, "svg", { viewBox: "0 0 70 70", width: 70, height: 70 }); svgEl(sv, "path", { d: "M" + (rx < 0 ? 66 : 4) + " " + (ry < 0 ? 40 : 30) + " L" + (rx < 0 ? 66 : 4) + " " + (ry < 0 ? 66 : 4) + " L" + (rx < 0 ? 40 : 30) + " " + (ry < 0 ? 66 : 4), fill: "none", stroke: BZ, "stroke-width": 6, "stroke-linecap": "round" }); return g; };
  [[22, 548, 1, 1], [988, 548, -1, 1], [22, 1112, 1, -1], [988, 1112, -1, -1]].forEach(([x, y, rx, ry], i) => { const b = brk(x, y, rx, ry); tl.from(b, { opacity: 0, scale: 1.8, duration: 0.4, ease: "power3.out" }, S.s2.start + 0.5 + i * 0.08); });
  const tFic = PW("p2", "fictional");
  const w2a = el(s2i, "w2a", "ser", "left:0;right:0;top:1190px;text-align:center;font-size:84px;line-height:1;color:#fff", "A FICTIONAL SITE"); tl.from(w2a, { opacity: 0, y: 50, duration: 0.45, ease: "power3.out" }, tFic - 0.1);
  const w2b = chip(s2i, "w2b", 150, 300, "INSPIRED BY JUMEIRAH · NOT A REAL PLOT", { size: 24, bd: BZ }); tl.from(w2b, { opacity: 0, x: -40, duration: 0.3 }, PW("p2", "Jumeirah") - 0.2);
  const w2c = chip(s2i, "w2c", 60, 370, "NOT GOOGLE MAPS · A BLENDER SCENE", { size: 24, bd: AZ }); tl.from(w2c, { opacity: 0, x: -40, duration: 0.3 }, PW("p2", "site") - 0.1);
  const bot2 = presenter(botAt(s2i, "bot2", 860, 1310, 170), "s2", -1); speak(bot2, "p2"); bot2.react(tl, tFic + 0.4, "think");

  /* ================================================================= S3 THE BRIEF: four requirements build on the narrated words */
  const s3i = dark("s3");
  const gr = el(s3i, "gr3", "", "position:absolute;inset:0;background-image:linear-gradient(rgba(76,195,255,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(76,195,255,.10) 2px,transparent 2px);background-size:90px 90px");
  tl.to(gr, { backgroundPosition: "0px -360px", duration: S.s3.len, ease: "none" }, S.s3.start);
  tag(s3i, "h3", "STEP 1 · THE BRIEF FOR CLAUDE CODE", S.s3.start + 0.2, { bd: AZ });
  const sm = chip(s3i, "sm3", 60, 296, "BRIEF SUMMARY · NOT A SCREEN RECORDING", { size: 22, bd: BZ }); tl.from(sm, { opacity: 0, duration: 0.3 }, S.s3.start + 0.6);
  const ic = {
    floors: '<rect x="14" y="8" width="52" height="9" rx="2"/><rect x="14" y="22" width="52" height="9" rx="2"/><rect x="14" y="36" width="52" height="9" rx="2"/><rect x="14" y="50" width="52" height="9" rx="2"/><rect x="14" y="64" width="52" height="9" rx="2"/>',
    glass: '<path d="M40 6 L70 40 L40 74 L10 40 Z"/><path d="M40 6 L40 74 M10 40 L70 40 M25 23 L55 57 M55 23 L25 57"/>',
    land: '<path d="M40 74 C40 50 38 36 30 24 M40 74 C42 52 48 38 58 30"/><path d="M30 24 C16 22 10 30 8 38 M30 24 C38 12 52 12 60 18 M58 30 C70 30 74 40 72 46"/>',
    inter: '<rect x="12" y="32" width="56" height="24" rx="6"/><rect x="6" y="40" width="14" height="22" rx="5"/><rect x="60" y="40" width="14" height="22" rx="5"/><path d="M20 66 L20 74 M60 66 L60 74"/>'
  };
  const reqs = [["50 FLOORS", "floors", PW("p3", "50") - 0.25], ["GLASS FAÇADE", "glass", PW("p3", "glass") - 0.25], ["LANDSCAPING", "land", PW("p3", "Landscaping") - 0.25], ["INTERIOR DESIGN", "inter", PW("p3", "interiors") - 0.25]];
  reqs.forEach(([txt, key, at], i) => {

    const sv = svgEl(el(c, "rqi" + i, "", "left:34px;top:55px;width:80px;height:80px"), "svg", { viewBox: "0 0 80 80", width: 80, height: 80, fill: "none", stroke: AZ, "stroke-width": 4, "stroke-linejoin": "round", "stroke-linecap": "round" }); sv.innerHTML = ic[key];
    el(c, "rqt" + i, "ser", "left:150px;top:0;height:190px;font-size:74px;line-height:190px;color:#fff", txt);
    const ul = el(c, "rqu" + i, "", "left:0;bottom:0;width:940px;height:8px;background:" + BZ + ";transform-origin:0 50%"); gsap.set(ul, { scaleX: 0 });
    tl.from(c, { opacity: 0, x: 120, duration: 0.45, ease: "power3.out" }, at); tl.to(ul, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at + 0.15);
  });
  const bot3 = presenter(botAt(s3i, "bot3", 860, 1310, 170), "s3", -1); speak(bot3, "p3"); bot3.react(tl, PW("p3", "interiors") + 0.3, "nod");

  /* ================================================================= S4 THE FILE: real tower_params.json lines, verbatim, zoomed on the narrated numbers */
  const s4i = dark("s4");
  const lw = 960, lidH = 744, g4 = el(s4i, "l4", "", "left:60px;top:300px;width:" + lw + "px;height:" + (lidH + 34) + "px");
  const lid = el(g4, "l4lid", "", "left:0;top:0;width:" + lw + "px;height:" + lidH + "px;border-radius:22px 22px 8px 8px;background:linear-gradient(180deg,#2B3A55,#121A2C);border:3px solid " + BZ + ";box-shadow:0 34px 70px rgba(0,0,0,.55)");
  const scr = el(lid, "l4scr", "", "left:19px;top:19px;width:" + (lw - 44) + "px;height:700px;overflow:hidden;border-radius:6px;background:#0B1630");
  el(g4, "l4base", "", "left:" + (-lw * 0.04) + "px;top:" + lidH + "px;width:" + (lw * 1.08) + "px;height:22px;border-radius:0 0 22px 22px;background:linear-gradient(180deg,#C9C2B5,#8F877A);box-shadow:0 14px 30px rgba(0,0,0,.5)");
  el(scr, "l4b", "", "left:0;top:0;width:" + (lw - 44) + "px;height:56px;background:#16294F;border-bottom:2px solid " + BZ);
  [0, 1, 2].forEach(i => el(scr, "l4d" + i, "", "left:" + (22 + i * 28) + "px;top:20px;width:16px;height:16px;border-radius:50%;background:" + AZ + ";opacity:" + (0.9 - i * 0.25)));
  el(scr, "l4t", "", "left:120px;top:0;font:700 28px/56px var(--body);color:#DDEBFF", "architecture/tower_params.json  ·  excerpt");
  const rows = [['    "floors": 50,', "#FFE08A"], ['    "lobby_height": 9.0,'], ['    "floor_height": 4.0,'], ['    "base_radius": 24.0,'], ['    "taper": 0.36,'], ['    "lobe_amplitude": 0.15,'], ['    "lobe_count": 3,'], ['    "twist_degrees": 96,', "#FFE08A"], ['    "twist_exponent": 1.15,'], ['    "ring_points": 144,'], ['    "fin_count": 72,', "#FFE08A"]];
  const LH = 52, R0 = 84, hl = {};
  [7, 10, 0].forEach(i => { const h = el(scr, "hl" + i, "", "left:14px;top:" + (R0 + i * LH - 4) + "px;width:" + (lw - 72) + "px;height:" + (LH - 4) + "px;border-radius:8px;background:rgba(217,168,91,.28);border:2px solid " + BZ + ";transform-origin:0 50%"); gsap.set(h, { scaleX: 0 }); hl[i] = h; });
  let tt = S.s4.start + 0.5;

  const cam4 = wrapScene("s4");
  tag(s4i, "h4", "CLAUDE CODE WROTE THE PROJECT AS PYTHON + JSON", S.s4.start + 0.2, { size: 24, bd: AZ });

  const tTw = PW("p4", "twist"), tFin = PW("p4", "72"), tH = PW("p4", "height");
  tl.to(hl[0], { scaleX: 1, duration: 0.35, ease: "power2.out" }, tH - 0.1); zoomTo(cam4, 540, rowY(0) + 90, 1.22, tH - 0.2, 0.7);
  tl.to(hl[7], { scaleX: 1, duration: 0.35, ease: "power2.out" }, tTw - 0.2); zoomTo(cam4, 540, rowY(7) - 40, 1.28, tTw - 0.3, 0.7);
  tl.to(hl[10], { scaleX: 1, duration: 0.35, ease: "power2.out" }, tFin - 0.2); zoomTo(cam4, 540, rowY(10) - 120, 1.28, tFin - 0.3, 0.6); zoomOut(cam4, tFin + 1.1, 0.8);
  const nums = [["50 FLOORS", tH], ["96° TWIST", tTw], ["72 FINS", tFin]];
  nums.forEach(([t, at], i) => { const c = chip(s4i, "n4" + i, 60 + i * 330, 1130, t, { size: 30, bd: BZ, fg: "#fff" }); tl.from(c, { opacity: 0, y: 40, scale: 0.9, duration: 0.35, ease: "back.out(1.8)" }, at); });
  const bot4 = presenter(botAt(s4i, "bot4", 860, 1310, 170), "s4", -1); speak(bot4, "p4"); bot4.react(tl, tFin + 0.5, "nod");
