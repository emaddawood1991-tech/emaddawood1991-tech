<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FMC Arabic info cards (overlay study)</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "FMC Arabic"; src: url("assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "FMC Arabic"; src: url("assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2"); font-weight: 700; }
      body { margin: 0; background: transparent; font-family: "FMC Arabic", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* Safe zone for 1080x1920: top 270, bottom 420, sides 72 / 120 (Instagram UI). Cards sit at y 880-1330. */
      .card { position: absolute; left: 72px; right: 120px; display: flex; align-items: center; min-height: 112px; box-sizing: border-box; padding: 22px 34px; border-radius: 28px;
              color: #fff; font-size: 44px; font-weight: 700; line-height: 1.3; background: rgba(16, 42, 67, 0.78); border: 1.5px solid rgba(255,255,255,0.22); }
      #card-1 { top: 880px; } #card-2 { top: 1014px; } #card-3 { top: 1148px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="fmc-info-cards" data-start="0" data-width="1080" data-height="1920" data-duration="6">
      <div id="card-1" class="card clip" data-start="0.4" data-duration="5.1">تقييم دقيق للحالة</div>
      <div id="card-2" class="card clip" data-start="0.9" data-duration="4.6">تمارين تقوية ومرونة</div>
      <div id="card-3" class="card clip" data-start="1.4" data-duration="4.1">تصحيح وضعيات الجلوس</div>
    </div>
    <script>
      // Seekable, deterministic. Motion only: this composition has NO audio element and no effect of any kind (FMC_AUDIO policy).
      const tl = gsap.timeline({ paused: true });
      // Explicit tweens (not a loop) so `hyperframes keyframes` can resolve every start/target statically.
      tl.fromTo("#card-1", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.4);
      tl.fromTo("#card-2", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.9);
      tl.fromTo("#card-3", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 1.4);
      tl.to("#card-1", { opacity: 0, duration: 0.45, ease: "power1.in" }, 5.0);
      tl.to("#card-2", { opacity: 0, duration: 0.45, ease: "power1.in" }, 5.0);
      tl.to("#card-3", { opacity: 0, duration: 0.45, ease: "power1.in" }, 5.0);
      window.__timelines["fmc-info-cards"] = tl;
    </script>
  </body>
</html>
