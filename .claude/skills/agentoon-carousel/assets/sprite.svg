<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true">
  <!-- Agentoon robot mascot. Colours come from CSS vars: --m-head --m-screen --m-eye --m-body --m-ear --accent -->
  <symbol id="mascot" viewBox="0 0 200 230">
    <line x1="100" y1="22" x2="100" y2="50" stroke="var(--m-head)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="16" r="10" fill="var(--accent)"/>
    <rect x="14" y="88" width="20" height="40" rx="10" fill="var(--m-ear)"/>
    <rect x="166" y="88" width="20" height="40" rx="10" fill="var(--m-ear)"/>
    <rect x="28" y="48" width="144" height="116" rx="38" fill="var(--m-head)"/>
    <rect x="46" y="68" width="108" height="76" rx="26" fill="var(--m-screen)"/>
    <rect x="70" y="88" width="16" height="26" rx="8" fill="var(--m-eye)"/>
    <rect x="114" y="88" width="16" height="26" rx="8" fill="var(--m-eye)"/>
    <path d="M82 126 Q100 140 118 126" fill="none" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/>
    <rect x="58" y="170" width="84" height="50" rx="20" fill="var(--m-body)"/>
    <rect x="86" y="184" width="28" height="22" rx="8" fill="var(--accent)"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3-11 7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></symbol>
  <symbol id="i-bug" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="12" rx="4"/><path d="M9 8a3 3 0 0 1 6 0M3 12h5M16 12h5M4 19l4-2M20 19l-4-2M4 5l4 3M20 5l-4 3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
</svg>
