<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true">
  <!-- Agentoon robot mascot. Colours come from CSS vars: --m-head --m-screen --m-eye --m-body --m-ear --accent
       Moods: happy · wow · think · wink · focus · cheer · dizzy · oops · proud  (use mascot(width, mood)) -->
  <defs>
    <g id="m-base">
      <line x1="100" y1="22" x2="100" y2="50" stroke="var(--m-head)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="16" r="10" fill="var(--accent)"/>
      <rect x="14" y="88" width="20" height="40" rx="10" fill="var(--m-ear)"/>
      <rect x="166" y="88" width="20" height="40" rx="10" fill="var(--m-ear)"/>
      <rect x="28" y="48" width="144" height="116" rx="38" fill="var(--m-head)"/>
      <rect x="46" y="68" width="108" height="76" rx="26" fill="var(--m-screen)"/>
      <rect x="58" y="170" width="84" height="50" rx="20" fill="var(--m-body)"/>
      <rect x="86" y="184" width="28" height="22" rx="8" fill="var(--accent)"/>
    </g>
    <g id="m-eyes-happy"><rect x="70" y="88" width="16" height="26" rx="8" fill="var(--m-eye)"/><rect x="114" y="88" width="16" height="26" rx="8" fill="var(--m-eye)"/></g>
    <g id="m-eyes-arc" fill="none" stroke="var(--m-eye)" stroke-width="7" stroke-linecap="round"><path d="M66 108 Q78 90 90 108"/><path d="M110 108 Q122 90 134 108"/></g>
  </defs>

  <symbol id="mascot-happy" viewBox="0 0 200 230"><use href="#m-base"/><use href="#m-eyes-happy"/>
    <path d="M82 126 Q100 140 118 126" fill="none" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/></symbol>
  <symbol id="mascot" viewBox="0 0 200 230"><use href="#mascot-happy"/></symbol>

  <symbol id="mascot-wow" viewBox="0 0 200 230"><use href="#m-base"/>
    <ellipse cx="78" cy="98" rx="12" ry="19" fill="var(--m-eye)"/><ellipse cx="122" cy="98" rx="12" ry="19" fill="var(--m-eye)"/>
    <circle cx="82" cy="91" r="4.5" fill="var(--m-screen)"/><circle cx="126" cy="91" r="4.5" fill="var(--m-screen)"/>
    <ellipse cx="100" cy="130" rx="13" ry="10" fill="var(--m-eye)"/>
    <g stroke="var(--accent)" stroke-width="5" stroke-linecap="round"><path d="M178 28v18M169 37h18"/><path d="M22 36v14M15 43h14"/><path d="M164 6v10M159 11h10"/></g></symbol>

  <symbol id="mascot-think" viewBox="0 0 200 230"><use href="#m-base"/>
    <circle cx="82" cy="96" r="12" fill="var(--m-eye)"/><circle cx="126" cy="96" r="12" fill="var(--m-eye)"/>
    <circle cx="86" cy="92" r="5" fill="var(--m-screen)"/><circle cx="130" cy="92" r="5" fill="var(--m-screen)"/>
    <path d="M112 78 L140 72" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 130 H112" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="176" cy="30" r="6" fill="var(--accent)"/><circle cx="190" cy="12" r="4" fill="var(--accent)"/></symbol>

  <symbol id="mascot-wink" viewBox="0 0 200 230"><use href="#m-base"/>
    <rect x="70" y="88" width="16" height="26" rx="8" fill="var(--m-eye)"/>
    <path d="M110 102 H134" stroke="var(--m-eye)" stroke-width="7" stroke-linecap="round"/>
    <path d="M78 122 Q100 148 122 122 Z" fill="var(--m-eye)"/>
    <g stroke="var(--accent)" stroke-width="5" stroke-linecap="round"><path d="M178 30v16M170 38h16"/></g></symbol>

  <symbol id="mascot-focus" viewBox="0 0 200 230"><use href="#m-base"/>
    <rect x="68" y="96" width="20" height="10" rx="5" fill="var(--m-eye)"/>
    <circle cx="124" cy="100" r="16" fill="none" stroke="var(--m-eye)" stroke-width="6"/><circle cx="124" cy="100" r="6" fill="var(--m-eye)"/>
    <path d="M136 112 L150 126" stroke="var(--m-eye)" stroke-width="7" stroke-linecap="round"/>
    <path d="M86 130 H110" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/></symbol>

  <symbol id="mascot-cheer" viewBox="0 0 200 230"><use href="#m-base"/>
    <g stroke="var(--m-ear)" stroke-width="16" stroke-linecap="round" fill="none"><path d="M62 186 L22 142"/><path d="M138 186 L178 142"/></g>
    <circle cx="20" cy="138" r="11" fill="var(--m-ear)"/><circle cx="180" cy="138" r="11" fill="var(--m-ear)"/>
    <use href="#m-eyes-arc"/>
    <path d="M78 120 Q100 150 122 120 Z" fill="var(--m-eye)"/>
    <circle cx="62" cy="124" r="6" fill="var(--accent)" opacity=".7"/><circle cx="138" cy="124" r="6" fill="var(--accent)" opacity=".7"/></symbol>

  <symbol id="mascot-dizzy" viewBox="0 0 200 230"><use href="#m-base"/>
    <g fill="none" stroke="var(--m-eye)" stroke-width="5" stroke-linecap="round"><circle cx="78" cy="100" r="15"/><circle cx="78" cy="100" r="6"/><circle cx="122" cy="100" r="15"/><circle cx="122" cy="100" r="6"/></g>
    <path d="M84 130 Q92 122 100 130 T116 130" fill="none" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/></symbol>

  <symbol id="mascot-oops" viewBox="0 0 200 230"><use href="#m-base"/>
    <circle cx="78" cy="98" r="10" fill="var(--m-eye)"/><circle cx="122" cy="98" r="10" fill="var(--m-eye)"/>
    <path d="M66 80 L88 86 M134 80 L112 86" stroke="var(--m-eye)" stroke-width="5" stroke-linecap="round"/>
    <path d="M82 134 Q100 122 118 134" fill="none" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/>
    <path d="M168 56 q8 14 0 22 q-8 -8 0 -22z" fill="var(--accent)"/></symbol>

  <symbol id="mascot-proud" viewBox="0 0 200 230"><use href="#m-base"/>
    <path d="M138 186 L176 150" stroke="var(--m-ear)" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="178" cy="146" r="12" fill="var(--m-ear)"/>
    <use href="#m-eyes-arc"/>
    <path d="M82 126 Q100 142 118 126" fill="none" stroke="var(--m-eye)" stroke-width="6" stroke-linecap="round"/></symbol>

  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3-11 7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></symbol>
  <symbol id="i-bug" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="12" rx="4"/><path d="M9 8a3 3 0 0 1 6 0M3 12h5M16 12h5M4 19l4-2M20 19l-4-2M4 5l4 3M20 5l-4 3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
  <symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5S14.900 16.400 15.500 20M19 8v6M16 11h6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.200 9.500l6.100-.9z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
</svg>
